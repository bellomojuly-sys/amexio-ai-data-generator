<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMEXIO Dossier Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#132029; --muted:#52627A; --line:#D3DBE2;
  --accent:#0B6477; --accent-ink:#FFFFFF;
  --ai:#8A5100; --ai-bg:#FBEBD0; --code:#0B6477; --code-bg:#D8EDF1; --human:#46505E; --human-bg:#E3E8EE;
  --ok:#1B7043; --ok-bg:#DDF0E4; --bad:#B42318; --bad-bg:#FBE3DF;
  --codebg:#F4F7F9; --t-key:#0B6477; --t-str:#8A4B00; --t-num:#6B3FA0; --t-lit:#B42318; --t-com:#6B7785;
  --paper:#FFFDF7; --paper-ink:#1F1D1A; --paper-muted:#6B655B; --paper-line:#E5DDCB; --paper-stamp:#B42318;
  --fact:#FBEAA6; --fact-line:#B98A0E;
  --shadow:0 1px 2px rgba(19,32,41,.06), 0 10px 28px rgba(19,32,41,.07);
  --f-ui:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-doc:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1217; --surface:#141C23; --surface-2:#19232C; --ink:#E3E9EF; --muted:#94A4B5; --line:#283642;
    --accent:#4FB4C9; --accent-ink:#04212A;
    --ai:#E8AA4C; --ai-bg:#35270F; --code:#4FB4C9; --code-bg:#0E2D35; --human:#B6C1CC; --human-bg:#222D38;
    --ok:#5CCB8C; --ok-bg:#11301F; --bad:#FF8C7C; --bad-bg:#3B1714;
    --codebg:#0E151B; --t-key:#6CC8DA; --t-str:#E9B56C; --t-num:#C4A7F2; --t-lit:#FF8C7C; --t-com:#7D8B99;
    --paper:#EEE8DB; --paper-line:#D5CBB6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1217; --surface:#141C23; --surface-2:#19232C; --ink:#E3E9EF; --muted:#94A4B5; --line:#283642;
  --accent:#4FB4C9; --accent-ink:#04212A;
  --ai:#E8AA4C; --ai-bg:#35270F; --code:#4FB4C9; --code-bg:#0E2D35; --human:#B6C1CC; --human-bg:#222D38;
  --ok:#5CCB8C; --ok-bg:#11301F; --bad:#FF8C7C; --bad-bg:#3B1714;
  --codebg:#0E151B; --t-key:#6CC8DA; --t-str:#E9B56C; --t-num:#C4A7F2; --t-lit:#FF8C7C; --t-com:#7D8B99;
  --paper:#EEE8DB; --paper-line:#D5CBB6;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:16px/1.55 var(--f-ui); -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px; margin:0 auto; padding-inline:24px}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3,h4{margin:0; text-wrap:balance}
p{margin:0}
b,strong{font-weight:600}

/* header */
.top{background:var(--surface); border-bottom:1px solid var(--line)}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:14px 10px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; gap:2px}
.brand .eyebrow{margin:0}
.brand h1{font-size:19px; font-weight:700; letter-spacing:-.005em}
.brand h1 span{font-weight:500; color:var(--muted)}
.tools{display:flex; gap:8px; flex-wrap:wrap}
.rail{display:flex; flex-wrap:wrap; gap:6px; padding-block:4px 14px}
.rail-btn{display:inline-flex; align-items:center; gap:8px; padding:7px 12px 7px 10px; border:1px solid var(--line); background:var(--surface-2); border-radius:7px; cursor:pointer; font-size:14px; font-weight:500}
.rail-btn:hover{border-color:var(--muted)}
.rail-btn[aria-current="step"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.rail-num{font:500 12px/1 var(--f-mono); width:20px; height:20px; display:grid; place-items:center; border-radius:50%; border:1px solid currentColor; opacity:.8}
.rail-dot{width:8px; height:8px; border-radius:50%}
.rail-dot.ok{background:var(--ok)} .rail-dot.bad{background:var(--bad)}

.eyebrow{font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.who{font:600 11px/1 var(--f-ui); letter-spacing:.07em; text-transform:uppercase; padding:4px 7px; border-radius:4px; white-space:nowrap}
.who-ai{color:var(--ai); background:var(--ai-bg)}
.who-code{color:var(--code); background:var(--code-bg)}
.who-human{color:var(--human); background:var(--human-bg)}
.who + .who{margin-left:4px}

/* buttons */
.btn{display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:15px; padding:9px 15px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn-sm{font-size:13.5px; padding:6px 11px; font-weight:500}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.07); border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn:disabled{opacity:.45; cursor:default}

/* main */
main{padding-block:32px 40px; display:flex; flex-direction:column; gap:28px; min-height:60vh}
.head{display:flex; flex-direction:column; gap:10px; max-width:780px}
.head h2{font-size:clamp(26px, 3.2vw, 34px); line-height:1.15; font-weight:700; letter-spacing:-.015em}
.lede{font-size:18px; line-height:1.55; color:var(--muted); max-width:66ch}
.lede b{color:var(--ink)}
.small{font-size:14px; color:var(--muted); max-width:66ch}
h3{font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px}
.count{font:500 12.5px var(--f-mono); color:var(--muted)}
.split{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:32px; align-items:start}
.split-even{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:32px; align-items:start}
.stack{display:flex; flex-direction:column; gap:16px}
.callout{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:14px 16px; font-size:15px; max-width:70ch}
.callout strong{color:var(--ink)}

/* overview pipeline */
.pipe{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:16px}
.stage-card{position:relative; display:flex; flex-direction:column; gap:8px; text-align:left; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:10px; cursor:pointer}
.stage-card:hover{border-color:var(--muted)}
.stage-card:not(:nth-child(5))::after{content:"›"; position:absolute; right:-13px; top:22px; font-size:22px; line-height:1; color:var(--muted)}
.stage-card:not(:first-child)::before{content:""; position:absolute; left:50%; bottom:-17px; width:2px; height:16px; background:var(--accent); opacity:.6}
.sc-num{font:500 13px var(--f-mono); color:var(--muted)}
.sc-name{font-size:17px; font-weight:700; line-height:1.25}
.sc-who{display:flex; flex-wrap:wrap; gap:4px}
.sc-who .who + .who{margin-left:0}
.sc-text{font-size:14.5px; color:var(--muted); line-height:1.45}
.truth{grid-column:2 / -1; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; padding:13px 16px; border:1.5px dashed var(--accent); background:var(--code-bg); border-radius:10px; font-size:15px}
.truth strong{font-size:15px}
.principles{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:24px; padding-top:8px; border-top:1px solid var(--line)}
.principles > div{display:flex; flex-direction:column; gap:6px; padding-top:16px}
.principles p{color:var(--muted); font-size:15px}
.legend{display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:14px; color:var(--muted)}

/* definition list for config */
.facts{display:grid; grid-template-columns:max-content 1fr; gap:8px 20px; margin:0; font-size:15.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0; font-weight:500}

/* panels & code */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; font-weight:600}
.panel-head .file{font:500 13px var(--f-mono); color:var(--muted)}
.panel-body{padding:14px}
pre.code{margin:0; padding:16px; font:13.5px/1.6 var(--f-mono); background:var(--codebg); color:var(--ink); overflow:auto; max-height:64vh; tab-size:2; white-space:pre}
pre.prompt{white-space:pre-wrap; max-height:none; font-size:13px; border-top:1px solid var(--line)}
.t-key{color:var(--t-key)} .t-str{color:var(--t-str)} .t-num{color:var(--t-num)} .t-lit{color:var(--t-lit)} .t-com{color:var(--t-com); font-style:italic}
.t-tag{color:var(--t-key)} .t-attr{color:var(--t-num)}
details.drawer{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
details.drawer > summary{cursor:pointer; padding:11px 14px; font-weight:600; font-size:14.5px; list-style:none; display:flex; align-items:center; gap:8px}
details.drawer > summary::-webkit-details-marker{display:none}
details.drawer > summary::before{content:"▸"; color:var(--muted); transition:transform .15s}
details.drawer[open] > summary::before{transform:rotate(90deg)}
.drawers{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:start}

/* personas */
.cards{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:4px}
.pid{font:500 12.5px var(--f-mono); color:var(--accent)}
.pname{font-size:17px; font-weight:700}
.prole{font-size:14px; color:var(--muted)}
.pcard dl{display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; margin:8px 0 0; font-size:14px}
.pcard dt{color:var(--muted)} .pcard dd{margin:0}
.records{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:14.5px}
.records li{display:grid; grid-template-columns:84px 1fr; gap:10px}
.records .id{font:500 12.5px var(--f-mono); color:var(--accent); padding-top:2px}
.records span.r{color:var(--muted)}

/* timeline */
.tl{list-style:none; margin:0; padding:0}
.tl li{display:grid; grid-template-columns:96px 1fr; gap:14px}
.tl time{font:500 13.5px var(--f-mono); color:var(--muted); padding-top:14px; font-variant-numeric:tabular-nums; text-align:right}
.tl-body{position:relative; border-left:2px solid var(--line); padding:12px 0 14px 18px; display:flex; flex-direction:column; gap:6px}
.tl-body::before{content:""; position:absolute; left:-6px; top:19px; width:10px; height:10px; border-radius:50%; background:var(--surface); border:2px solid var(--accent)}
.tl-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tl-top .id{font:500 12.5px var(--f-mono); color:var(--accent)}
.tl-body p{font-size:14.5px; color:var(--muted)}
.tl li.flag time{color:var(--bad); font-weight:600}
.tl li.flag .tl-body{border-left-color:var(--bad)}
.tl li.flag .tl-body::before{border-color:var(--bad); background:var(--bad)}
.tl li.fixed time{color:var(--ok); font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font:500 12.5px var(--f-mono); padding:3px 7px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); white-space:nowrap}
.chip.doc{background:var(--code-bg); border-color:transparent; color:var(--code)}
.chip.none{color:var(--muted)}
.badge{font:600 11.5px/1 var(--f-ui); letter-spacing:.04em; text-transform:uppercase; padding:4px 7px; border-radius:4px}
.badge.bad{color:var(--bad); background:var(--bad-bg)}
.badge.ok{color:var(--ok); background:var(--ok-bg)}
.review{font-size:15px; color:var(--muted); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}

/* documents */
.doc-bar{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap}
.doc-tabs{display:flex; flex-wrap:wrap; gap:6px}
.doc-tab{display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; padding:8px 12px; border:1px solid var(--line); background:var(--surface); border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; line-height:1.3}
.doc-tab .id{font:500 12px var(--f-mono); color:var(--muted)}
.doc-tab[aria-selected="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.doc-tab .upd{font:600 10.5px var(--f-ui); color:var(--ok); text-transform:uppercase; letter-spacing:.05em}
.toggle{display:inline-flex; align-items:center; gap:8px; font-size:14.5px; cursor:pointer; user-select:none}
.toggle input{width:18px; height:18px; accent-color:var(--accent)}
.swatch{display:inline-block; padding:0 4px; background:var(--fact); border-bottom:1.5px solid var(--fact-line); color:var(--paper-ink); border-radius:2px}
.doc-grid{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,4fr); gap:28px; align-items:start}
.paper{position:relative; overflow:hidden; background:var(--paper); color:var(--paper-ink); font:16.5px/1.6 var(--f-doc); padding:34px 44px 44px; border:1px solid var(--paper-line); border-radius:3px; box-shadow:var(--shadow)}
.wm{position:absolute; inset:-20% -20%; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:120px; transform:rotate(-22deg); pointer-events:none; font:700 44px/1 var(--f-ui); letter-spacing:.06em; color:rgba(180,35,24,.075); white-space:nowrap; user-select:none}
.paper > *:not(.wm){position:relative}
.stamp{display:inline-block; font:700 11px/1 var(--f-ui); letter-spacing:.12em; text-transform:uppercase; color:var(--paper-stamp); border:1.5px solid var(--paper-stamp); padding:5px 8px; border-radius:3px; margin-bottom:18px}
.paper-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:12px; margin-bottom:18px; border-bottom:2px solid var(--paper-ink); flex-wrap:wrap}
.paper-from{font:500 13px var(--f-ui); color:var(--paper-muted); letter-spacing:.02em}
.paper-title{font:600 24px/1.2 var(--f-doc); margin-top:4px}
.paper-id{font:500 12.5px var(--f-mono); color:var(--paper-muted)}
.paper .kv{display:grid; grid-template-columns:max-content 1fr; gap:3px 20px; margin:0 0 14px}
.paper .kv dt{font:14px/1.75 var(--f-ui); color:var(--paper-muted)}
.paper .kv dd{margin:0}
.paper h4{font:600 12.5px var(--f-ui); letter-spacing:.09em; text-transform:uppercase; color:var(--paper-muted); margin:22px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--paper-line)}
.paper p{margin:0 0 12px; max-width:66ch}
.paper .right{text-align:right; max-width:none}
.paper .lines{margin:0 0 16px}
.paper table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-bottom:8px}
.paper td{padding:5px 0; border-bottom:1px solid var(--paper-line)}
.paper td:last-child{text-align:right; white-space:nowrap; padding-left:16px}
.paper tr:last-child td{font-weight:600; border-bottom:2px solid var(--paper-ink)}
mark.fact{background:var(--fact); color:inherit; border-bottom:1.5px solid var(--fact-line); padding:0 2px; border-radius:2px; transition:background .2s}
.no-hl mark.fact{background:transparent; border-bottom-color:transparent; padding:0}
.side{display:flex; flex-direction:column; gap:14px}
table.meta{width:100%; border-collapse:collapse; font-size:14px}
table.meta th{text-align:left; font-weight:500; color:var(--muted); padding:6px 12px 6px 14px; vertical-align:top; white-space:nowrap; border-top:1px solid var(--line)}
table.meta td{font:13px/1.5 var(--f-mono); padding:6px 14px 6px 0; border-top:1px solid var(--line); overflow-wrap:anywhere}
table.meta tr:first-child th, table.meta tr:first-child td{border-top:0}
table.meta tr.req th::after{content:" *"; color:var(--accent)}
.event-box{display:flex; flex-direction:column; gap:4px; font-size:14.5px}
.event-box .id{font:500 12.5px var(--f-mono); color:var(--accent)}
.fact-list{display:flex; flex-wrap:wrap; gap:5px; padding:12px 14px}
.fact-list .chip{font-size:11.5px}

/* validation */
.banner{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:16px 18px; border-radius:10px; border:1px solid var(--line); background:var(--surface)}
.banner .msg{display:flex; flex-direction:column; gap:2px}
.banner .msg strong{font-size:17px}
.banner .msg span{color:var(--muted); font-size:14.5px}
.banner.bad{background:var(--bad-bg); border-color:var(--bad)}
.banner.bad .msg strong{color:var(--bad)}
.banner.ok{background:var(--ok-bg); border-color:var(--ok)}
.banner.ok .msg strong{color:var(--ok)}
.checks{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.check{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:4px 14px; padding:14px 18px; border-top:1px solid var(--line); align-items:start}
.check:first-child{border-top:0}
.check .ic{grid-row:span 2; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font:700 13px/1 var(--f-ui); margin-top:1px}
.check .t{font-weight:600}
.check .d{grid-column:2 / 4; font-size:14.5px; color:var(--muted)}
.check.pass .ic{background:var(--ok-bg); color:var(--ok)}
.check.fail{background:var(--bad-bg)}
.check.fail .ic{background:var(--bad); color:var(--surface)}
.check.fail .t{color:var(--bad)}
.check.fail .d{color:var(--ink)}
.check.skip .ic{background:var(--human-bg); color:var(--human)}
.check.skip .t{color:var(--muted)}
.check.pending .ic{border:1.5px dashed var(--muted); color:var(--muted)}
.animate .check, .animate-banner{animation:rowIn .35s ease both; animation-delay:calc(var(--i, 0) * 140ms)}
@keyframes rowIn{from{opacity:0; transform:translateY(5px)}}
.fixbox{display:flex; flex-direction:column; gap:10px; padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.fixbox p{color:var(--muted); font-size:15px; max-width:72ch}
.fixbox p b{color:var(--ink)}
.fixbox .btn{align-self:flex-start}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px}

/* export */
.stats{display:flex; flex-wrap:wrap; gap:10px 28px; padding:14px 18px; background:var(--surface); border:1px solid var(--line); border-radius:10px; font-size:15px; color:var(--muted)}
.stats b{font:600 22px/1 var(--f-ui); color:var(--ink); font-variant-numeric:tabular-nums; margin-right:6px}
.stats .zero b{color:var(--ok)}
pre.tree{margin:0; padding:16px; font:13.5px/1.75 var(--f-mono); background:var(--codebg); border:1px solid var(--line); border-radius:10px; overflow:auto}
.tree .dim{color:var(--muted)}
.locked{display:flex; gap:18px; align-items:flex-start; padding:26px; background:var(--surface); border:1.5px dashed var(--line); border-radius:12px; max-width:720px}
.locked svg{flex:none; color:var(--muted)}
.locked div{display:flex; flex-direction:column; gap:10px; align-items:flex-start}
.locked p{color:var(--muted)}

/* questions */
.qs{list-style:none; counter-reset:q; margin:0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px}
.qs li{counter-increment:q; display:grid; grid-template-columns:34px 1fr; gap:4px 12px; padding:16px 18px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.qs li::before{content:counter(q); grid-row:span 2; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font:600 14px var(--f-mono); background:var(--surface-2); border:1px solid var(--line)}
.qs p{color:var(--muted); font-size:15px}
.about{max-width:78ch; display:flex; flex-direction:column; gap:8px; padding-top:18px; border-top:1px solid var(--line)}
.about p{color:var(--muted); font-size:15px}
.about code{font:13.5px var(--f-mono); color:var(--ink)}

/* notes + pager */
.notes{border:1.5px dashed var(--muted); border-radius:10px; padding:14px 18px; background:var(--surface-2)}
.notes h3{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.notes ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px; font-size:15px}
.pager{position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding-block:10px calc(10px + env(safe-area-inset-bottom, 0px)); z-index:5}
.pager .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px}
.pager .where{font-size:14px; color:var(--muted); text-align:center; display:flex; flex-direction:column; gap:1px}
.pager .where b{color:var(--ink)}
.kbd{font:500 12px var(--f-mono); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--surface-2)}

@media (max-width:1000px){
  .pipe{grid-template-columns:1fr 1fr}
  .stage-card::after, .stage-card::before{display:none}
  .truth{grid-column:1 / -1}
  .principles{grid-template-columns:1fr}
  .split, .split-even, .doc-grid{grid-template-columns:minmax(0,1fr)}
  .qs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .pipe, .cards, .drawers, .two{grid-template-columns:minmax(0,1fr)}
  .paper{padding:24px 20px 28px; font-size:15.5px}
  .tl li{grid-template-columns:74px 1fr; gap:10px}
  .tl time{font-size:12px}
  .rail-btn .rail-label{display:none}
  .rail-btn[aria-current="step"] .rail-label, .rail-btn.unnum .rail-label{display:inline}
  .pager .hint{display:none}
  .pager .lbl{display:none}
  .pager .btn{padding-inline:14px}
  .facts{grid-template-columns:1fr; gap:2px}
  .facts dd{margin-bottom:8px}
}
@media (prefers-reduced-motion: reduce){
  .animate .check, .animate-banner{animation:none}
  mark.fact, details.drawer > summary::before{transition:none}
}

<script>
(function(){
const DATA = JSON.parse(document.getElementById('dossier-data').textContent);
const S = {step:0, notes:false, highlight:true, validated:false, fixed:false, doc:0, animate:false};
const P = DATA.cast.personas, O = DATA.cast.orgs, FIX = DATA.fix;
const REQUIRED = DATA.config.metadata_fields.required;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const cur = () => DATA.states[S.fixed ? 'fixed' : 'generated'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const shortDate = iso => { const [y,m,d] = iso.split('-').map(Number); return d + ' ' + MON[m-1] + ' ' + y; };
const longDate = iso => { const [y,m,d] = iso.split('-').map(Number); return d + ' ' + MONL[m-1] + ' ' + y; };
const WHO = {human:'Human', ai:'AI', code:'Code'};
const whoTag = w => '<span class="who who-' + w + '">' + WHO[w] + '</span>';
const origDate = DATA.states.generated.events.find(e => e.id === FIX.event).date;
const unlocked = () => S.fixed && S.validated;
const failing = () => S.validated && cur().checks.some(c => c.status === 'fail');

const CHECK_DESC = {
  required: 'Every document has the fields the configuration marks as required.',
  references: 'Every persona, event and document ID that is referenced actually exists.',
  names: 'Each participant is named exactly as in the persona record.',
  timeline: 'Events follow each other in time, and nothing happens before the incident.',
  meta_text: "The date in each document's metadata also appears in its text.",
  amounts: 'The repair estimate adds up, and the payment matches it.',
  synthetic: 'Every document carries the watermark and DataType = SYNTHETIC.',

function hlJSON(obj){
  const s = JSON.stringify(obj, null, 2);
  const re = /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    const cls = m[1] ? (m[2] ? 'key' : 'str') : (m[3] ? 'lit' : 'num');
    out += '<span class="t-' + cls + '">' + esc(m[1] || m[0]) + '</span>' + (m[2] ? esc(m[2]) : '');
    last = re.lastIndex;
  }
  return out + esc(s.slice(last));
}
function hlXML(x){
  const s = x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return s.replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?[\w?:.-]+)|([\w:-]+)=("[^"]*")|(\/?\??&gt;)/g,
    (m, com, tag, an, av, close) => com ? '<span class="t-com">' + com + '</span>'
      : tag ? '<span class="t-tag">' + tag + '</span>'
      : an ? '<span class="t-attr">' + an + '</span>=<span class="t-str">' + av + '</span>'
      : '<span class="t-tag">' + close + '</span>');
}
const personChip = id => '<span class="chip">' + id + ' ' + esc(P[id].name) + '</span>';
const docChip = id => '<span class="chip doc">' + id + '</span>';

/* ---------- steps ---------- */

  const cards = [
    [1, 'Configure', ['human'], 'Domain, scenario, size, document types and required metadata.'],

    [3, 'Documents', ['ai','code'], 'The AI writes the text; code fills in names, dates and amounts.'],
    [4, 'Validate', ['code'], 'Rule-based checks on the whole dossier. Errors block the export.'],
    [5, 'Export', ['code'], 'Folder structure plus XML for the Content Server import.']

  return '<div class="head"><p class="eyebrow">How we interpret the generation process</p>'
    + '<h2>From a configuration file to an import package</h2>'
    + '<p class="lede">We follow one synthetic insurance claim, <b>CLM-10045</b>, through the flow AMEXIO described: configure, generate and review, validate, export. The example was prepared in advance, so nothing depends on a live AI call.</p></div>'

    + '<div class="truth"><strong>Dossier model</strong><span>The single source of truth: IDs, names, dates, amounts and relationships. Written once in step 2, read by steps 3, 4 and 5.</span></div></div>'
    + '<div class="principles">'
    + '<div><h3>The AI writes, code keeps the facts</h3><p>Names, dates, IDs and amounts live in the dossier model. The AI never types them into a document itself.</p></div>'
    + '<div><h3>Create once, reference everywhere</h3><p>Each persona and event is generated once and gets an ID. Documents point to those IDs instead of re-inventing details.</p></div>'
    + '<div><h3>No export without validation</h3><p>Rule-based checks run over the whole dossier. A single error blocks the import package.</p></div>'
    + '</div>'
    + '<div class="legend"><span>Who does the work:</span>' + whoTag('human') + '<span>the user</span>' + whoTag('ai') + '<span>a language model</span>' + whoTag('code') + '<span>ordinary program code</span></div>'
    + '<p class="small">These choices come from our risk analysis, where hallucinated facts (R1) and metadata that doesn\'t match the document (R2) scored highest.</p>';
}

function rConfigure(){

    + '<div class="head"><p class="eyebrow">Step 1 ' + whoTag('human') + '</p><h2>Configure the run</h2>'
    + '<p class="lede">The user picks a domain and scenario, sets the size, and lists the metadata the target system needs. This one file drives every later step.</p></div>'
    + '<dl class="facts">'

    + '</div><div class="panel"><div class="panel-head"><span>Configuration</span><span class="file">config.json</span></div><pre class="code">' + hlJSON(c) + '</pre></div></div>';
}

function rCast(){

    + '</dl></div>').join('');

  const records = Object.entries(O).map(([id, o]) => '<li><span class="id">' + id + '</span><span>' + esc(o.name) + ' <span class="r">· ' + esc(o.role) + '</span></span></li>').join('')

  const tl = ev.map(e => {

    return '<li class="' + (flag ? 'flag' : fixed ? 'fixed' : '') + '"><time datetime="' + e.date + '">' + shortDate(e.date) + '</time><div class="tl-body">'

  }).join('');
  return '<div class="head"><p class="eyebrow">Step 2 ' + whoTag('ai') + whoTag('human') + '</p><h2>Generate the personas and the storyline</h2>'

    + '<p class="review">' + whoTag('human') + '<span>Review point: this is where the user adjusts a persona or corrects the storyline, as in step 2 of AMEXIO\'s example flow.</span></p>';
}

  const blocks = d.blocks.map(([k, v]) => {
    if (k === 'kv') return '<dl class="kv">' + v.map(([a, b]) => '<dt>' + a + '</dt><dd>' + b + '</dd>').join('') + '</dl>';
    if (k === 'h') return '<h4>' + v + '</h4>';
    if (k === 'p') return '<p>' + v + '</p>';
    if (k === 'right') return '<p class="right">' + v + '</p>';
    if (k === 'lines') return '<div class="lines">' + v.map(x => x || '&nbsp;').join('<br>') + '</div>';
    if (k === 'table') return '<table>' + v.map(([a, b]) => '<tr><td>' + a + '</td><td>' + b + '</td></tr>').join('') + '</table>';
    return '';
  }).join('');
  const meta = Object.entries(d.metadata).map(([k, v]) => '<tr class="' + (REQUIRED.includes(k) ? 'req' : '') + '"><th>' + k + '</th><td>' + esc(Array.isArray(v) ? v.join(', ') : v) + '</td></tr>').join('');
  return '<div class="head"><p class="eyebrow">Step 3 ' + whoTag('ai') + whoTag('code') + '</p><h2>Write the documents</h2>'
    + '<p class="lede">Each document belongs to one event. The AI writes the text and leaves placeholders; code fills in every name, date and amount from the dossier model.</p></div>'
    + '<div class="doc-bar"><div class="doc-tabs" role="tablist" aria-label="Documents">' + tabs + '</div>'
    + '<label class="toggle"><input type="checkbox" id="hl-toggle" ' + (S.highlight ? 'checked' : '') + '> Highlight <span class="swatch">facts</span> from the dossier model</label></div>'
    + '<div class="doc-grid"><article class="paper' + (S.highlight ? '' : ' no-hl') + '" id="paper" aria-label="' + esc(d.type_label) + '">'
    + '<div class="wm" aria-hidden="true"><span>AI-GENERATED FAKE DATA</span><span>AI-GENERATED FAKE DATA</span><span>AI-GENERATED FAKE DATA</span></div>'
    + '<span class="stamp">AI-generated fake data · synthetic</span>'
    + '<div class="paper-head"><div><div class="paper-from">' + d.from + '</div><div class="paper-title">' + esc(d.type_label) + '</div></div><div class="paper-id">' + d.id + '</div></div>'
    + blocks + '</article>'
    + '<aside class="side">'
    + (changed ? '<div class="callout"><span class="badge ok">Re-rendered</span> This document uses the date of ' + FIX.event + '. It changed from ' + longDate(origDate) + ' to ' + longDate(FIX.date) + ' when the model was corrected; nobody edited the text.</div>' : '')
    + '<div class="panel"><div class="panel-head"><span>Records this event</span></div><div class="panel-body event-box"><span class="id">' + ev.id + ' · ' + shortDate(ev.date) + '</span><b>' + esc(ev.label) + '</b><span class="small">' + esc(ev.summary) + '</span></div></div>'
    + '<div class="panel"><div class="panel-head"><span>Metadata</span>' + whoTag('code') + '</div><table class="meta">' + meta + '</table></div>'
    + '<div class="panel"><div class="panel-head"><span>Placeholders filled</span><span class="count">' + d.facts.length + '</span></div><div class="fact-list">' + d.facts.map(f => '<span class="chip">' + esc(f) + '</span>').join('') + '</div></div>'
    + '<details class="drawer"><summary>Prompt used for documents</summary><pre class="code prompt">' + esc(DATA.prompts.document) + '</pre></details>'
    + '</aside></div>';
}

function rValidate(){
  const st = cur();
  const ran = S.validated;
  const checks = ran ? st.checks : DATA.states.generated.checks.map(c => Object.assign({}, c, {status: c.status === 'skip' ? 'skip' : 'pending', detail: CHECK_DESC[c.id]}));
  const fails = checks.filter(c => c.status === 'fail');
  const ruleCount = checks.filter(c => c.id !== 'ai_review').length;
  let banner;
  if (!ran) banner = '<div class="banner"><div class="msg"><strong>Not run yet</strong><span>' + ruleCount + ' checks in code, plus one planned AI review.</span></div><button class="btn btn-primary" data-action="run">Run validation</button></div>';
  else if (fails.length) banner = '<div class="banner bad animate-banner" style="--i:' + (S.animate ? checks.length : 0) + '"><div class="msg"><strong>' + fails.length + ' error found. Export is blocked.</strong><span>' + (ruleCount - fails.length) + ' of ' + ruleCount + ' checks passed.</span></div></div>';
  else banner = '<div class="banner ok animate-banner" style="--i:' + (S.animate ? checks.length : 0) + '"><div class="msg"><strong>All checks passed. Export is unlocked.</strong><span>' + ruleCount + ' of ' + ruleCount + ' checks passed.</span></div><button class="btn btn-primary" data-go="5">Continue to export →</button></div>';
  const icon = {pass:'✓', fail:'✕', skip:'–', pending:''};
  const list = '<ol class="checks' + (S.animate ? ' animate' : '') + '">' + checks.map((c, i) => '<li class="check ' + c.status + '" style="--i:' + i + '"><span class="ic" aria-hidden="true">' + icon[c.status] + '</span><span class="t">' + esc(c.title) + '</span>' + whoTag(c.id === 'ai_review' ? 'ai' : 'code') + '<span class="d">' + esc(c.detail) + '</span></li>').join('') + '</ol>';
  let after = '';
  if (ran && fails.length) {
    after = '<div class="two"><div class="fixbox"><h3>How this gets fixed</h3><p>The storyline step is re-run for <b>' + FIX.event + '</b>, or the reviewer corrects the date. The date lives in one place, the dossier model, so every document that uses it follows: <b>' + DATA.changed_by_fix.join(' and ') + '</b>.</p>'
      + '<button class="btn btn-primary" data-action="fix">Correct ' + FIX.event + ' and validate again</button></div>'
      + '<div class="fixbox"><h3>Why several kinds of checks</h3><p>"Metadata matches the document text" passed even with this error. The claim form agrees with the model; the model itself is wrong. Only the timeline rule catches it.</p></div></div>';
  } else if (ran && S.fixed) {
    after = '<div class="fixbox"><h3>What changed</h3><p><b>' + FIX.event + '</b> moved from ' + longDate(origDate) + ' to ' + longDate(FIX.date) + '. <b>' + DATA.changed_by_fix.join(' and ') + '</b> were re-rendered from the corrected model. No document was edited by hand.</p></div>';
  }
  return '<div class="head"><p class="eyebrow">Step 4 ' + whoTag('code') + '</p><h2>Validate the dossier</h2>'
    + '<p class="lede">Plain code checks the whole dossier, so it gives the same answer every time. Export stays locked until there are no errors.</p></div>'
    + banner + list + after;
}

function rExport(){
  const head = '<div class="head"><p class="eyebrow">Step 5 ' + whoTag('code') + '</p><h2>Export for Content Server</h2>'
    + '<p class="lede">Code writes a folder with the documents and one XML control file that tells Content Server where each document goes and which metadata it carries.</p></div>';
  if (!unlocked()) {
    return head + '<div class="locked"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2" fill="none"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none"/></svg>'
      + '<div><h3>Export is locked</h3><p>' + (S.validated ? 'Validation found an error. Fix it in step 4 first.' : 'Run the validation in step 4 first. Nothing is exported until every check passes.') + '</p>'
      + '<button class="btn btn-primary" data-go="4">Go to step 4</button></div></div>';
  }
  const st = cur();
  const files = st.docs.map((d, i) => '    ' + (i === st.docs.length - 1 ? '└── ' : '├── ') + d.file).join('\n');
  const tree = 'export/\n├── import.xml        <span class="dim"># control file</span>\n└── CLM-10045/\n' + files;
  return head
    + '<div class="stats"><span><b>1</b>dossier</span><span><b>' + st.docs.length + '</b>documents</span><span><b>' + st.events.length + '</b>events</span><span><b>' + Object.keys(P).length + '</b>personas</span><span class="zero"><b>0</b>errors</span></div>'
    + '<div class="split"><section class="stack"><h3>Folder structure</h3><pre class="tree">' + tree + '</pre>'
    + '<p class="small">Documents are plain text in this demo. The proof of concept can write PDF or DOCX instead.</p>'
    + '<div class="callout"><strong>Format.</strong> The XML follows the shape of the Content Server Object Importer: an &lt;import&gt; element with one &lt;node type="folder|document" action="create"&gt; per item. Category and attribute names are placeholders until AMEXIO shares its schema.</div></section>'
    + '<section class="panel"><div class="panel-head"><span class="file">export/import.xml</span><button class="btn btn-sm" data-action="copy-xml" id="copy-xml">Copy XML</button></div><pre class="code" id="xml-pre">' + hlXML(st.xml) + '</pre></section></div>';
}

function rQuestions(){
  const qs = [
    ['Order and review points', 'Is this the order you expect, and are these the right moments for a person to review and edit?'],
    ['Process branches', 'Is one straight path from accident to payment enough for now, or should we model branches such as a disputed or rejected claim from the start?'],
    ['Required metadata', 'Which Content Server categories and attributes are mandatory, and in which formats (dates, case numbers, allowed values)?'],
    ['File types and language', 'Which file types should the export contain (PDF, DOCX, TXT), and should the documents be in Dutch or English?'],
    ['What a large case looks like', 'For a case with thousands of documents, which document types repeat? Emails, invoices, reports, something else?'],
    ['Facts filled by code', 'Are you comfortable with the AI writing only the text, while code fills in every fact? It trades some freedom for consistency.']
  ];
  return '<div class="head"><p class="eyebrow">Your input</p><h2>What we\'d like your feedback on</h2>'
    + '<p class="lede">The answers decide what we build first in the proof of concept.</p></div>'
    + '<ol class="qs">' + qs.map(q => '<li><h3>' + q[0] + '</h3><p>' + q[1] + '</p></li>').join('') + '</ol>'
    + '<div class="about"><h3>About this demo</h3><p>The personas, storyline and document texts were written with an AI assistant ahead of time, following the stage prompts shown in steps 2 and 3. The validation and the XML export ran as real code: <code>validate_and_export.py</code>, included in the demo folder. It is not the proof of concept yet: one domain, one dossier, no live AI calls.</p></div>';
}

const STEPS = [
  {id:'overview', label:'Overview', who:[], render:rOverview, notes:[
    'Open with the idea in one line: the AI writes the content, code keeps the facts straight.',
    'Point at the dashed "Dossier model" bar: it is written once and every later step reads from it.',
    'Link it to the risk analysis: R1 hallucination and R2 metadata mismatch scored highest (20).']},
  {id:'configure', num:1, label:'Configure', who:['human'], render:rConfigure, notes:[
    'This is also the configuration outline AMEXIO asked for as a bonus.',
    'Say clearly that the required metadata fields are our guess until their mock data arrives.',
    'Mention their wish for 100 dossiers of 10 to 10,000 documents: the goal is that only numbers change.']},
  {id:'cast', num:2, label:'Personas & storyline', who:['ai','human'], render:rCast, notes:[
    'Personas have IDs and are generated once; documents refer to P001, not to "some claimant".',
    'Walk through the timeline quickly. Do not point out EVT-002 yet; see if anyone notices the date.',
    'This is the review moment from AMEXIO\'s flow (step 2: review and adjust before documents).']},
  {id:'documents', num:3, label:'Documents', who:['ai','code'], render:rDocuments, notes:[
    'Turn the highlighting off and on: every highlighted value came from the model, not from the AI.',
    'Open DOC-003: it also mentions the submission date, so the error from EVT-002 spreads here too.',
    'Metadata on the right is filled by code from the same model, so it cannot disagree with the text.']},
  {id:'validate', num:4, label:'Validate', who:['code'], render:rValidate, notes:[
    'Click Run validation. The timeline check fails: the claim is submitted two days before the accident.',
    'Point out that "metadata matches text" still passed. That is why we check on several levels.',
    'Click the fix: one correction in the model updates two documents. Then continue to export.']},
  {id:'export', num:5, label:'Export', who:['code'], render:rExport, notes:[
    'The export only exists because validation passed; before that this screen is locked.',
    'XML shape follows the Content Server Object Importer; attribute names are placeholders.',
    'Everything carries DataType = SYNTHETIC, as agreed for fake data.']},
  {id:'questions', label:'Questions', who:[], render:rQuestions, notes:[
    'Go through the questions and write down the answers.',
    'Question 2 (branches) and 3 (metadata) have the biggest effect on the planning.']}
];

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
function renderRail(){
  $('rail').innerHTML = STEPS.map((s, i) => {
    let dot = '';
    if (s.id === 'validate' && S.validated) dot = '<span class="rail-dot ' + (failing() ? 'bad' : 'ok') + '" aria-label="' + (failing() ? 'has errors' : 'passed') + '"></span>';
    return '<button class="rail-btn' + (s.num ? '' : ' unnum') + '" data-go="' + i + '"' + (i === S.step ? ' aria-current="step"' : '') + '>'
      + (s.num ? '<span class="rail-num">' + s.num + '</span>' : '') + '<span class="rail-label">' + s.label + '</span>' + dot + '</button>';
  }).join('');
}
function render(scroll){
  const s = STEPS[S.step];
  renderRail();
  $('stage').innerHTML = s.render();
  $('notes').innerHTML = '<h3>Presenter notes · ' + s.label + '</h3><ul>' + s.notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>';
  $('notes-wrap').hidden = !S.notes;
  $('notes-btn').setAttribute('aria-pressed', String(S.notes));
  $('where').textContent = (s.num ? 'Step ' + s.num + ' · ' : '') + s.label;
  $('prev').disabled = S.step === 0;
  $('next').disabled = S.step === STEPS.length - 1;
  S.animate = false;
  if (scroll) window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
}
function go(i){ S.step = Math.max(0, Math.min(STEPS.length - 1, i)); render(true); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-action],[data-doc]');
  if (!t) return;
  if (t.dataset.go !== undefined) return go(Number(t.dataset.go));
  if (t.dataset.doc !== undefined) { S.doc = Number(t.dataset.doc); return render(false); }
  const a = t.dataset.action;
  if (a === 'next') go(S.step + 1);
  else if (a === 'prev') go(S.step - 1);
  else if (a === 'notes') { S.notes = !S.notes; render(false); }
  else if (a === 'reset') { S.validated = false; S.fixed = false; S.doc = 0; go(0); }
  else if (a === 'run') { S.validated = true; S.animate = true; render(false); }
  else if (a === 'fix') { S.fixed = true; S.validated = true; S.animate = true; render(false); }
  else if (a === 'copy-xml') {
    const btn = t;
    const done = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = 'Copy XML'; }, 2200); };
    const select = () => { const r = document.createRange(); r.selectNodeContents($('xml-pre')); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); done('Selected, press Ctrl+C'); };
    try { navigator.clipboard.writeText(cur().xml).then(() => done('Copied'), select); } catch (err) { select(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'hl-toggle') { S.highlight = e.target.checked; const p = $('paper'); if (p) p.classList.toggle('no-hl', !S.highlight); }
});
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(S.step + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(S.step - 1); }
  else if (e.key === 'n' || e.key === 'N') { S.notes = !S.notes; render(false); }
});
const stepFromHash = () => STEPS.findIndex(s => s.id === (location.hash || '').slice(1));
window.addEventListener('hashchange', () => { const i = stepFromHash(); if (i >= 0 && i !== S.step) go(i); });
if (stepFromHash() > 0) S.step = stepFromHash();
render(false);
})();
</script>
