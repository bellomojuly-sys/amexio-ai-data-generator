name: tests

on:
  push:
  pull_request:

jobs:
  # H2 secret guard: scan the whole git history for keys and tokens.
  # fetch-depth 0 = all commits (the default checkout has only the last one).
  # gitleaks exits non-zero on a finding, which turns this job red.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --verbose .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  # The dossier generator demo: its case files must stay in step with the case
  # model (generated types, demo_cases fixtures, the same broken cases refused).
  # AMEXIO's mock package is not in git, so the golden comparison is skipped here.
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator/demo_dossier_generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: generator/demo_dossier_generator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Daniel's PDF Template Studio (mock PDFs -> templates). Separate app, own
  # requirements; its regression script checks the wizard without a browser.
  template-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_template_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python test_wizard.py
